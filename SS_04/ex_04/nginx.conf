server {
    listen 80;
    server_name localhost;

    # ==========================================================================
    # Định tuyến tới User Service (chạy cổng nội bộ 8081)
    # ==========================================================================
    location /users/ {
        # KHẮC PHỤC LỖI 502 BAD GATEWAY:
        # Thay thế 'localhost' bằng tên DNS Service Name trong Docker Compose: 'user_service'
        # Dấu gạch chéo '/' ở cuối proxy_pass giúp Nginx cắt bỏ prefix '/users/' trước khi forward tới backend
        proxy_pass http://user_service:8081/;

        # Chuyển tiếp các thông tin Header thực của client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình thời gian chờ kết nối
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # ==========================================================================
    # Định tuyến tới Product Service (chạy cổng nội bộ 8082)
    # ==========================================================================
    location /products/ {
        # Thay thế 'localhost' bằng tên DNS Service Name trong Docker Compose: 'product_service'
        # Dấu gạch chéo '/' ở cuối proxy_pass giúp Nginx cắt bỏ prefix '/products/' trước khi forward tới backend
        proxy_pass http://product_service:8082/;

        # Chuyển tiếp các thông tin Header thực của client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình thời gian chờ kết nối
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Endpoint kiểm tra trạng thái sức khỏe của Nginx Proxy
    location /health {
        return 200 '{"status":"UP","message":"Nginx Reverse Proxy is running"}';
        add_header Content-Type application/json;
    }
}

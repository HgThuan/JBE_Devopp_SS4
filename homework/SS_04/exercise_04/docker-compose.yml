version: '3.8'

services:
  nginx_proxy:
    image: nginx:alpine
    container_name: storex-nginx-proxy
    ports:
      - "80:80"
    volumes:
      # Mount file cấu hình Nginx Reverse Proxy vào thư mục cấu hình của Nginx
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user_service
      - product_service
    networks:
      - storex-network
    restart: always

  user_service:
    image: storex-user:latest
    container_name: storex-user-service
    # Port 8081 chỉ cần mở trong mạng nội bộ Docker network để Nginx proxy_pass tới, không cần publish ra ngoài host
    expose:
      - "8081"
    networks:
      - storex-network
    restart: on-failure

  product_service:
    image: storex-product:latest
    container_name: storex-product-service
    # Port 8082 chỉ cần mở trong mạng nội bộ Docker network để Nginx proxy_pass tới, không cần publish ra ngoài host
    expose:
      - "8082"
    networks:
      - storex-network
    restart: on-failure

networks:
  storex-network:
    driver: bridge
